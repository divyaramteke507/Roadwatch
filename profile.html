<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile – RoadWatch India</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,600&family=Cinzel:wght@400;500;600;700;900&family=Noto+Serif+Devanagari:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --saffron: #FF9933; --white: #FFFFFF; --navy: #000080;
    --gold: #C9922A; --green: #138808; --chakra: #0047AB;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Cormorant Garamond', serif;
    background: linear-gradient(160deg, #FFF3DC 0%, #FFE0A0 20%, #FFDAA0 40%, #FFD080 60%, #FFB84A 80%, #FF9933 100%);
    min-height: 100vh; overflow-x: hidden; position: relative;
  }

  .top-bar {
    background: var(--navy); color: var(--gold); padding: 12px 24px;
    display: flex; justify-content: space-between; align-items: center;
    font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 0.2em;
    flex-wrap: wrap; gap: 10px;
  }

  .royal-border {
    position: absolute; top: 50px; left: 12px; right: 12px; bottom: 12px;
    border: 2px solid rgba(201,146,42,0.55); pointer-events: none; z-index: 9999;
    border-radius: 2px; min-height: calc(100vh - 62px);
  }
  .royal-border::before { content: ''; position: absolute; inset: 4px; border: 1px solid rgba(201,146,42,0.3); border-radius: 1px; }

  .container {
    max-width: 1200px; margin: 80px auto 40px; padding: 0 30px; position: relative; z-index: 10;
  }

  .profile-header {
    background: rgba(255,255,255,0.25); backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.6); border-radius: 20px;
    padding: 30px; margin-bottom: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    display: flex; align-items: center; gap: 30px; flex-wrap: wrap;
  }

  .profile-photo {
    width: 120px; height: 120px; border-radius: 50%;
    border: 4px solid var(--gold); object-fit: cover;
    box-shadow: 0 0 30px rgba(201,146,42,0.4);
  }

  .profile-info {
    flex: 1;
  }
  .profile-name {
    font-family: 'Cinzel', serif; font-size: 28px; color: var(--navy);
    letter-spacing: 0.1em; margin-bottom: 8px;
  }
  .profile-email {
    font-size: 16px; color: rgba(0,0,80,0.7); margin-bottom: 15px;
  }
  .profile-badges {
    display: flex; gap: 10px; flex-wrap: wrap;
  }
  .badge {
    padding: 6px 12px; border-radius: 20px; font-family: 'Cinzel', serif;
    font-size: 11px; letter-spacing: 0.1em; font-weight: 600;
  }
  .badge-verified {
    background: rgba(19,136,8,0.2); color: var(--green); border: 1px solid var(--green);
  }
  .badge-active {
    background: rgba(0,0,128,0.2); color: var(--navy); border: 1px solid var(--navy);
  }

  .session-timer {
    background: rgba(255,193,7,0.2); border: 1px solid #F57C00;
    border-radius: 12px; padding: 20px; margin-bottom: 30px;
    text-align: center;
  }
  .timer-label {
    font-family: 'Cinzel', serif; font-size: 13px; color: var(--navy);
    letter-spacing: 0.1em; margin-bottom: 10px;
  }
  .timer-display {
    font-family: 'Cinzel', serif; font-size: 36px; color: #E65100;
    font-weight: 700; letter-spacing: 0.05em;
  }
  .timer-warning {
    font-size: 13px; color: rgba(0,0,80,0.7); margin-top: 8px;
  }

  .section-card {
    background: rgba(255,255,255,0.25); backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.6); border-radius: 20px;
    padding: 30px; margin-bottom: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.1);
  }

  .section-title {
    font-family: 'Cinzel', serif; font-size: 20px; color: var(--navy);
    letter-spacing: 0.1em; margin-bottom: 20px; display: flex;
    align-items: center; gap: 10px;
  }

  .report-item {
    background: rgba(255,255,255,0.4); border: 1px solid rgba(0,0,128,0.2);
    border-radius: 12px; padding: 20px; margin-bottom: 15px;
    transition: all 0.3s;
  }
  .report-item:hover {
    transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.1);
  }

  .report-header {
    display: flex; justify-content: space-between; align-items: start;
    margin-bottom: 12px; flex-wrap: wrap; gap: 10px;
  }
  .report-category {
    font-family: 'Cinzel', serif; font-size: 16px; color: var(--navy);
    font-weight: 600; letter-spacing: 0.05em;
  }
  .report-status {
    padding: 4px 10px; border-radius: 15px; font-family: 'Cinzel', serif;
    font-size: 10px; letter-spacing: 0.1em; font-weight: 600;
  }
  .status-reported { background: rgba(255,193,7,0.2); color: #F57C00; border: 1px solid #F57C00; }
  .status-review { background: rgba(33,150,243,0.2); color: #1976D2; border: 1px solid #1976D2; }
  .status-assigned { background: rgba(156,39,176,0.2); color: #7B1FA2; border: 1px solid #7B1FA2; }
  .status-progress { background: rgba(255,152,0,0.2); color: #E65100; border: 1px solid #E65100; }
  .status-resolved { background: rgba(76,175,80,0.2); color: #388E3C; border: 1px solid #388E3C; }

  .report-details {
    font-size: 14px; color: rgba(0,0,80,0.75); line-height: 1.6;
    margin-bottom: 10px;
  }
  .report-meta {
    display: flex; gap: 20px; flex-wrap: wrap; font-size: 12px;
    color: rgba(0,0,80,0.6);
  }
  .report-meta-item {
    display: flex; align-items: center; gap: 5px;
  }

  .btn-report {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 14px 32px; background: linear-gradient(135deg, var(--navy), var(--navy));
    color: var(--gold); font-family: 'Cinzel', serif; font-size: 13px;
    letter-spacing: 0.2em; border: 1px solid rgba(201,146,42,0.5);
    border-radius: 12px; cursor: pointer; transition: all 0.4s;
    box-shadow: 0 8px 32px rgba(0,0,128,0.3); text-decoration: none;
  }
  .btn-report:hover {
    transform: translateY(-2px); box-shadow: 0 12px 40px rgba(0,0,128,0.4);
  }

  .empty-state {
    text-align: center; padding: 60px 20px; color: rgba(0,0,80,0.6);
  }
  .empty-state-icon {
    font-size: 64px; margin-bottom: 20px; opacity: 0.5;
  }

  @media (max-width: 768px) {
    .container { padding: 0 15px; margin-top: 60px; }
    .profile-header { padding: 20px; }
    .profile-photo { width: 80px; height: 80px; }
    .profile-name { font-size: 20px; }
    .section-card { padding: 20px; }
    .timer-display { font-size: 28px; }
  }
</style>
</head>
<body>

  <div class="top-bar">
    <div>🛡️ ROADWATCH INDIA • MY PROFILE</div>
    <div>
      <a href="report.html" style="color: var(--gold); text-decoration: none; margin-right: 15px;">REPORT ISSUE</a>
      <a href="index.html" style="color: var(--gold); text-decoration: none;">HOME</a>
    </div>
  </div>

  <div class="royal-border"></div>

  <div class="container">
    
    <!-- Profile Header -->
    <div class="profile-header">
      <img src="Ashok_Stambh.png" class="profile-photo" alt="Citizen Photo" id="profilePhoto">
      <div class="profile-info">
        <div class="profile-name" id="profileName">Citizen Name</div>
        <div class="profile-email" id="profileEmail">citizen@example.com</div>
        <div class="profile-badges">
          <span class="badge badge-verified">✓ AADHAAR VERIFIED</span>
          <span class="badge badge-active">● ACTIVE SESSION</span>
        </div>
      </div>
    </div>

    <!-- Session Expiry Timer -->
    <div class="session-timer">
      <div class="timer-label">⏱️ SESSION EXPIRES IN</div>
      <div class="timer-display" id="sessionTimer">15:00</div>
      <div class="timer-warning">Your secure session will automatically expire for security</div>
    </div>

    <!-- Reported Issues Section -->
    <div class="section-card">
      <div class="section-title">
        📋 MY REPORTED ISSUES
      </div>
      
      <div id="reportsList">
        <!-- Reports will be loaded here -->
      </div>

      <div style="text-align: center; margin-top: 20px;">
        <a href="report.html" class="btn-report">
          ➕ REPORT NEW ISSUE
        </a>
      </div>
    </div>

  </div>

<script>
  // Load Profile Data
  try {
    const authData = JSON.parse(sessionStorage.getItem('authResult') || '{}');
    if (authData.firstName) {
      document.getElementById('profileName').textContent = authData.firstName + ' ' + authData.lastName;
    }
    if (authData.email) {
      document.getElementById('profileEmail').textContent = authData.email;
    }
    
    const photo = sessionStorage.getItem('citizenPhoto');
    if (photo) {
      document.getElementById('profilePhoto').src = photo;
    }
  } catch(e) {}

  // Session Timer (15 minutes countdown)
  let sessionTime = 15 * 60; // 15 minutes in seconds
  const timerDisplay = document.getElementById('sessionTimer');
  
  function updateTimer() {
    const minutes = Math.floor(sessionTime / 60);
    const seconds = sessionTime % 60;
    timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    
    if (sessionTime <= 0) {
      alert('Session expired! Please login again.');
      window.location.href = 'login.html';
      return;
    }
    
    // Change color when less than 5 minutes
    if (sessionTime <= 300) {
      timerDisplay.style.color = '#C62828';
    }
    
    sessionTime--;
  }
  
  setInterval(updateTimer, 1000);
  updateTimer();

  // Load Reported Issues
  function loadReports() {
    const reports = JSON.parse(localStorage.getItem('roadReports') || '[]');
    const reportsList = document.getElementById('reportsList');
    
    if (reports.length === 0) {
      reportsList.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">📭</div>
          <div style="font-family: 'Cinzel', serif; font-size: 18px; color: var(--navy); margin-bottom: 10px; letter-spacing: 0.1em;">
            NO REPORTS YET
          </div>
          <div style="font-size: 14px;">
            Start reporting road issues to make your community safer
          </div>
        </div>
      `;
      return;
    }
    
    reportsList.innerHTML = reports.map((report, index) => {
      const statusClass = 'status-' + (report.status || 'reported').toLowerCase().replace(' ', '-');
      const categoryNames = {
        'pothole': 'Pothole',
        'crack': 'Road Crack',
        'waterlogging': 'Waterlogging',
        'manhole': 'Open Manhole',
        'divider': 'Broken Divider',
        'streetlight': 'Missing Streetlight',
        'crossing': 'Faded Zebra Crossing'
      };
      
      return `
        <div class="report-item">
          <div class="report-header">
            <div class="report-category">${categoryNames[report.category] || report.category || 'Road Issue'}</div>
            <div class="report-status ${statusClass}">${report.status || 'REPORTED'}</div>
          </div>
          <div class="report-details">
            <strong>Location:</strong> ${report.roadName || 'Location not specified'}<br>
            <strong>Description:</strong> ${report.description || 'No description provided'}
          </div>
          <div class="report-meta">
            <div class="report-meta-item">
              📅 ${new Date(report.timestamp).toLocaleDateString('en-IN')}
            </div>
            <div class="report-meta-item">
              🕐 ${new Date(report.timestamp).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' })}
            </div>
            <div class="report-meta-item">
              📍 Lat: ${report.location?.lat?.toFixed(4) || 'N/A'}, Lng: ${report.location?.lng?.toFixed(4) || 'N/A'}
            </div>
          </div>
        </div>
      `;
    }).reverse().join('');
  }
  
  loadReports();
</script>
</body>
</html>
