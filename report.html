<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report Road Issue – RoadWatch India</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,600&family=Cinzel:wght@400;500;600;700;900&family=Noto+Serif+Devanagari:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --saffron: #FF9933; --white: #FFFFFF; --navy: #000080;
    --gold: #C9922A; --green: #138808; --chakra: #0047AB;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Cormorant Garamond', serif;
    background: linear-gradient(160deg, #FFF3DC 0%, #FFE0A0 20%, #FFDAA0 40%, #FFD080 60%, #FFB84A 80%, #FF9933 100%);
    min-height: 100vh; overflow-x: hidden; position: relative;
  }

  .top-bar {
    background: var(--navy); color: var(--gold); padding: 12px 24px;
    display: flex; justify-content: space-between; align-items: center;
    font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 0.2em;
  }

  .royal-border {
    position: absolute; top: 50px; left: 12px; right: 12px; bottom: 12px;
    border: 2px solid rgba(201,146,42,0.55); pointer-events: none; z-index: 9999;
    border-radius: 2px; min-height: calc(100vh - 62px);
  }
  .royal-border::before { content: ''; position: absolute; inset: 4px; border: 1px solid rgba(201,146,42,0.3); border-radius: 1px; }

  .container {
    max-width: 1200px; margin: 80px auto 40px; padding: 0 30px; position: relative; z-index: 10;
  }

  .page-header {
    text-align: center; margin-bottom: 40px;
  }
  .page-title {
    font-family: 'Cinzel', serif; font-size: clamp(28px, 5vw, 48px);
    color: var(--navy); letter-spacing: 0.12em; margin-bottom: 10px;
  }
  .page-subtitle {
    font-size: 18px; color: rgba(0,0,80,0.7);
  }

  .report-form {
    background: rgba(255,255,255,0.25); backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.6); border-radius: 20px;
    padding: 40px; box-shadow: 0 10px 40px rgba(0,0,0,0.1);
  }

  .form-section {
    margin-bottom: 30px;
  }
  .section-title {
    font-family: 'Cinzel', serif; font-size: 16px; color: var(--navy);
    letter-spacing: 0.1em; margin-bottom: 15px; display: flex;
    align-items: center; gap: 10px;
  }

  .form-group {
    margin-bottom: 20px;
  }
  .form-label {
    display: block; font-family: 'Cinzel', serif; font-size: 13px;
    color: var(--navy); letter-spacing: 0.08em; margin-bottom: 8px;
  }
  .form-input, .form-textarea, .form-select {
    width: 100%; padding: 12px 16px; border: 1px solid rgba(0,0,128,0.3);
    border-radius: 8px; font-family: 'Cormorant Garamond', serif;
    font-size: 16px; background: rgba(255,255,255,0.6);
    transition: all 0.3s;
  }
  .form-input:focus, .form-textarea:focus, .form-select:focus {
    outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,146,42,0.2);
  }
  .form-textarea {
    min-height: 100px; resize: vertical;
  }

  #map {
    width: 100%; height: 400px; border-radius: 12px;
    border: 2px solid rgba(0,0,128,0.2); margin-bottom: 15px;
  }

  .photo-upload-area {
    border: 2px dashed rgba(0,0,128,0.3); border-radius: 12px;
    padding: 40px; text-align: center; cursor: pointer;
    transition: all 0.3s; background: rgba(255,255,255,0.4);
  }
  .photo-upload-area:hover {
    border-color: var(--gold); background: rgba(255,255,255,0.6);
  }
  .photo-upload-area input[type="file"] {
    display: none;
  }
  .upload-icon {
    font-size: 48px; color: var(--navy); margin-bottom: 10px;
  }

  .photo-preview {
    display: none; margin-top: 15px; gap: 10px; flex-wrap: wrap;
  }
  .photo-preview img {
    width: 150px; height: 150px; object-fit: cover;
    border-radius: 8px; border: 2px solid var(--gold);
  }

  .ai-result {
    display: none; margin-top: 20px; padding: 20px;
    background: rgba(19,136,8,0.1); border: 1px solid rgba(19,136,8,0.3);
    border-radius: 12px;
  }
  .ai-result-title {
    font-family: 'Cinzel', serif; font-size: 14px; color: var(--green);
    letter-spacing: 0.1em; margin-bottom: 10px;
  }

  .btn-submit {
    width: 100%; padding: 18px; background: linear-gradient(135deg, var(--navy), var(--navy));
    color: var(--gold); font-family: 'Cinzel', serif; font-size: 14px;
    letter-spacing: 0.2em; border: 1px solid rgba(201,146,42,0.5);
    border-radius: 12px; cursor: pointer; transition: all 0.4s;
    box-shadow: 0 8px 32px rgba(0,0,128,0.3);
  }
  .btn-submit:hover {
    transform: translateY(-2px); box-shadow: 0 12px 40px rgba(0,0,128,0.4);
  }
  .btn-submit:disabled {
    opacity: 0.5; cursor: not-allowed;
  }

  .severity-badge {
    display: inline-block; padding: 6px 12px; border-radius: 20px;
    font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 0.1em;
    font-weight: 600;
  }
  .severity-low { background: rgba(255,193,7,0.2); color: #F57C00; border: 1px solid #F57C00; }
  .severity-medium { background: rgba(255,152,0,0.2); color: #E65100; border: 1px solid #E65100; }
  .severity-critical { background: rgba(244,67,54,0.2); color: #C62828; border: 1px solid #C62828; }

  @media (max-width: 768px) {
    .container { padding: 0 15px; margin-top: 60px; }
    .report-form { padding: 20px; }
    #map { height: 300px; }
  }
</style>
</head>
<body>

  <div class="top-bar">
    <div>🛡️ ROADWATCH INDIA • REPORT ROAD ISSUES</div>
    <div><a href="profile.html" style="color: var(--gold); text-decoration: none;">MY PROFILE</a></div>
  </div>

  <div class="royal-border"></div>

  <div class="container">
    <div class="page-header">
      <h1 class="page-title">REPORT ROAD ISSUE</h1>
      <p class="page-subtitle">रास्ते सुरक्षित तो सपने सुरक्षित</p>
    </div>

    <form class="report-form" id="reportForm">
      
      <!-- Location Section -->
      <div class="form-section">
        <div class="section-title">
          📍 LOCATION INTELLIGENCE
        </div>
        <div class="form-group">
          <label class="form-label">Road Name or Landmark</label>
          <input type="text" class="form-input" id="roadName" placeholder="e.g., NH-58 Meerut Highway">
        </div>
        <div id="map"></div>
        <div style="font-size: 13px; color: rgba(0,0,80,0.6); margin-top: 10px;">
          📌 Click on map to set location or use GPS auto-detect
        </div>
      </div>

      <!-- Photo Upload Section -->
      <div class="form-section">
        <div class="section-title">
          📷 GEOTAGGED PHOTO UPLOAD
        </div>
        <label class="photo-upload-area" for="photoInput">
          <div class="upload-icon">📸</div>
          <div style="font-family: 'Cinzel', serif; font-size: 14px; color: var(--navy); letter-spacing: 0.1em; margin-bottom: 5px;">
            UPLOAD ROAD PHOTO
          </div>
          <div style="font-size: 13px; color: rgba(0,0,80,0.6);">
            AI will classify damage type and severity
          </div>
          <input type="file" id="photoInput" accept="image/*" capture="environment" multiple>
        </label>
        <div class="photo-preview" id="photoPreview"></div>
        
        <div class="ai-result" id="aiResult">
          <div class="ai-result-title">🤖 AI DAMAGE CLASSIFICATION</div>
          <div id="aiResultContent"></div>
        </div>
      </div>

      <!-- Issue Details Section -->
      <div class="form-section">
        <div class="section-title">
          📝 ISSUE DETAILS
        </div>
        <div class="form-group">
          <label class="form-label">Issue Category</label>
          <select class="form-select" id="issueCategory">
            <option value="">Select Issue Type</option>
            <option value="pothole">Pothole</option>
            <option value="crack">Road Crack</option>
            <option value="waterlogging">Waterlogging</option>
            <option value="manhole">Open Manhole</option>
            <option value="divider">Broken Divider</option>
            <option value="streetlight">Missing Streetlight</option>
            <option value="crossing">Faded Zebra Crossing</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea class="form-textarea" id="description" placeholder="Describe the road issue in detail..."></textarea>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        SUBMIT VERIFIED REPORT
      </button>
    </form>
  </div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // Initialize Map
  const map = L.map('map').setView([28.6139, 77.2090], 13); // Delhi default
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors'
  }).addTo(map);

  let marker;
  let selectedLocation = null;

  // GPS Auto-detect
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(position => {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      map.setView([lat, lng], 15);
      marker = L.marker([lat, lng]).addTo(map);
      selectedLocation = { lat, lng };
    });
  }

  // Click to set location
  map.on('click', function(e) {
    if (marker) map.removeLayer(marker);
    marker = L.marker(e.latlng).addTo(map);
    selectedLocation = { lat: e.latlng.lat, lng: e.latlng.lng };
  });

  // Photo Upload & AI Classification (Simulated)
  document.getElementById('photoInput').addEventListener('change', function(e) {
    const files = e.target.files;
    const preview = document.getElementById('photoPreview');
    const aiResult = document.getElementById('aiResult');
    const aiContent = document.getElementById('aiResultContent');
    
    preview.innerHTML = '';
    preview.style.display = 'flex';
    
    Array.from(files).forEach(file => {
      const reader = new FileReader();
      reader.onload = function(event) {
        const img = document.createElement('img');
        img.src = event.target.result;
        preview.appendChild(img);
      };
      reader.readAsDataURL(file);
    });

    // Simulate AI Classification
    setTimeout(() => {
      const issueTypes = ['Pothole', 'Road Crack', 'Waterlogging', 'Open Manhole'];
      const severities = ['Low', 'Medium', 'Critical'];
      const randomIssue = issueTypes[Math.floor(Math.random() * issueTypes.length)];
      const randomSeverity = severities[Math.floor(Math.random() * severities.length)];
      
      aiResult.style.display = 'block';
      aiContent.innerHTML = `
        <div style="margin-bottom: 10px;">
          <strong>Issue Type:</strong> ${randomIssue}
        </div>
        <div style="margin-bottom: 10px;">
          <strong>Severity:</strong> <span class="severity-badge severity-${randomSeverity.toLowerCase()}">${randomSeverity}</span>
        </div>
        <div>
          <strong>Urgency Score:</strong> ${Math.floor(Math.random() * 40) + 60}/100
        </div>
      `;
      
      // Auto-fill category
      const categoryMap = {
        'Pothole': 'pothole',
        'Road Crack': 'crack',
        'Waterlogging': 'waterlogging',
        'Open Manhole': 'manhole'
      };
      document.getElementById('issueCategory').value = categoryMap[randomIssue] || '';
    }, 1500);
  });

  // Form Submit
  document.getElementById('reportForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    if (!selectedLocation) {
      alert('Please select a location on the map');
      return;
    }
    
    const reportData = {
      roadName: document.getElementById('roadName').value,
      location: selectedLocation,
      category: document.getElementById('issueCategory').value,
      description: document.getElementById('description').value,
      timestamp: new Date().toISOString(),
      status: 'Reported'
    };
    
    // Save to localStorage
    let reports = JSON.parse(localStorage.getItem('roadReports') || '[]');
    reports.push(reportData);
    localStorage.setItem('roadReports', JSON.stringify(reports));
    
    alert('✅ Report submitted successfully!\n\nYour complaint has been registered and will be reviewed by authorities.');
    window.location.href = 'profile.html';
  });
</script>
</body>
</html>
